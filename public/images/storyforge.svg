t-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#a99a84" text-anchor="middle">STR</text><text x="519" y="253" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#e2c69f" text-anchor="middle">14</text><rect x="586" y="189" width="101" height="90" rx="8" fill="#2e2931" stroke="#524550"/><text x="636" y="216" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#a99a84" text-anchor="middle">DEX</text><text x="636" y="253" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#e2c69f" text-anchor="middle">19</text><rect x="703" y="189" width="101" height="90" rx="8" fill="#2e2931" stroke="#524550"/><text x="753" y="216" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#a99a84" text-anchor="middle">CON</text><text x="753" y="253" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#e2c69f" text-anchor="middle">16</text><rect x="820" y="189" width="101" height="90" rx="8" fill="#2e2931" stroke="#524550"/><text x="870" y="216" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#a99a84" text-anchor="middle">INT</text><text x="870" y="253" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#e2c69f" text-anchor="middle">12</text><rect x="937" y="189" width="101" height="90" rx="8" fill="#2e2931" stroke="#524550"/><text x="987" y="216" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#a99a84" text-anchor="middle">WIS</text><text x="987" y="253" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#e2c69f" text-anchor="middle">17</text><rect x="1054" y="189" width="101" height="90" rx="8" fill="#2e2931" stroke="#524550"/><text x="1104" y="216" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#a99a84" text-anchor="middle">CHA</text><text x="1104" y="253" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#e2c69f" text-anchor="middle">10</text><text x="469" y="324" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#e2c69f" text-anchor="start">The story so far</text><text x="469" y="358" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#b4a799" text-anchor="start">A map that should not exist. A debt not quite repaid.</text><text x="469" y="382" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#b4a799" text-anchor="start">Elara keeps her promises, even the inconvenient ones.</text><text x="469" y="406" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#b4a799" text-anchor="start">Somewhere beyond the northern ridge, there is a name</text><text x="469" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#b4a799" text-anchor="start">she has been trying to forget.</text><text x="469" y="492" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#e2c69f" text-anchor="start">Carried, not forgotten</text><rect x="469" y="515" width="675" height="39" rx="6" fill="#2e2931" stroke="#524550"/><text x="487" y="540" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#b9ab98" text-anchor="start">An old compass</text><text x="1124" y="540" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#e2c69f" text-anchor="end">↗</text><rect x="469" y="563" width="675" height="39" rx="6" fill="#2e2931" stroke="#524550"/><text x="487" y="588" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#b9ab98" text-anchor="start">Ashwood longbow</text><text x="1124" y="588" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#e2c69f" text-anchor="end">↗</text><rect x="469" y="611" width="675" height="39" rx="6" fill="#2e2931" stroke="#524550"/><text x="487" y="636" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#b9ab98" text-anchor="start">A letter, unopened</text><text x="1124" y="636" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#e2c69f" text-anchor="end">↗</text></svg>