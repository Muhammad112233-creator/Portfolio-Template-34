<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f6f7f6"/><rect x="0" y="0" width="1200" height="32" rx="0" fill="#e9edea"/><circle cx="16" cy="16" r="4" fill="#cc776e"/><circle cx="31" cy="16" r="4" fill="#c4a268"/><circle cx="46" cy="16" r="4" fill="#75a181"/><text x="600" y="21" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#788981" text-anchor="middle">margin.workspace</text><rect x="0" y="32" width="232" height="688" rx="0" fill="#ffffff"/><text x="25" y="78" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#1c302b" text-anchor="start">margin</text><rect x="16" y="102" width="198" height="34" rx="6" fill="#f6f7f6" stroke="#dfe5e3"/><text x="30" y="124" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#1c302b" text-anchor="start">＋  New conversation</text><text x="28" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#788981" text-anchor="start">Search your workspace</text><text x="28" y="211" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#788981" text-anchor="start">Recent conversations</text><text x="28" y="247" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#788981" text-anchor="start">Product strategy</text><text x="28" y="283" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#788981" text-anchor="start">Team knowledge</text><text x="28" y="319" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#788981" text-anchor="start">Saved answers</text><text x="27" y="414" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#788981" text-anchor="start">YOUR SPACES</text><text x="27" y="452" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#1c302b" text-anchor="start">  Product &amp; design</text><text x="27" y="490" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#1c302b" text-anchor="start">  Customer research</text><text x="27" y="528" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#1c302b" text-anchor="start">  The company handbook</text><text x="27" y="680" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#788981" text-anchor="start">● Local workspace    Settings</text><line x1="232" y1="32" x2="232" y2="720" stroke="#dfe5e3" stroke-width="1" /><text x="266" y="74" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#788981" text-anchor="start">Product &amp; design   /   Research notes</text><line x1="232" y1="97" x2="1200" y2="97" stroke="#dfe5e3" stroke-width="1" /><text x="312" y="173" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#1c302b" text-anchor="start">What did we learn about onboarding?</text><text x="312" y="208" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#788981" text-anchor="start">Looking across 24 research notes in your workspace</text><rect x="312" y="244" width="785" height="294" rx="12" fill="#ffffff" stroke="#dfe5e3"/><text x="337" y="278" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#1c302b" text-anchor="start">✦  A few things worth paying attention to</text><text x="337" y="316" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#1c302b" text-anchor="start">People are not struggling to understand the features. They are</text><text x="337" y="341" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#1c302b" text-anchor="start">struggling to see which one is useful for the job in front of them.</text><text x="337" y="366" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#1c302b" text-anchor="start">The first session asks for a lot of setup before it gives anything back.</text><text x="337" y="391" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#788981" text-anchor="start"></text><text x="337" y="416" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#788981" text-anchor="start">Three recurring moments matter most:</text><text x="337" y="441" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#788981" text-anchor="start">01   The first useful thing should happen before account setup.</text><text x="337" y="466" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#788981" text-anchor="start">02   A concrete example is more useful than a feature tour.</text><text x="337" y="491" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#788981" text-anchor="start">03   Keep a person’s first piece of work visible when they return.</text><rect x="312" y="561" width="252" height="43" rx="6" fill="#ffffff" stroke="#dfe5e3"/><text x="325" y="587" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#788981" text-anchor="start">01  Interview notes</text><rect x="580" y="561" width="252" height="43" rx="6" fill="#ffffff" stroke="#dfe5e3"/><text x="593" y="587" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#788981" text-anchor="start">02  Activation study</text><rect x="848" y="561" width="252" height="43" rx="6" fill="#ffffff" stroke="#dfe5e3"/><text x="861" y="587" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#788981" text-anchor="start">03  Pilot feedback</text><rect x="312" y="634" width="785" height="55" rx="12" fill="#ffffff" stroke="#dfe5e3"/><text x="333" y="668" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#788981" text-anchor="start">Ask a follow-up, or look at a source...</text><circle cx="1064" cy="662" r="16" fill="#8eaeac"/><text x="1064" y="668" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#f6f7f6" text-anchor="middle">↑</text></svg>